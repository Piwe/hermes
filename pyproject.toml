[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes"
version = "0.0.1"
description = "Local repo-memory + Q&A daemon built on Nous Hermes 3 — the smallest slice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes contributors" }]
dependencies = [
    "typer>=0.12",
    "lancedb>=0.13",
    "pyarrow>=15",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
hermes = "hermes.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["hermes"]
